name: CI

on:
  pull_request:
    branches: [dev, rec, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Run unit tests
        run: timeout 600 uv run --with pyyaml python3 -m unittest discover -s tests -v
      - name: Verify clean lockfile passes
        uses: ./
        with:
          mode: deps
          path: tests/e2e/clean
      - name: Verify moderate lockfile passes
        uses: ./
        with:
          mode: deps
          path: tests/e2e/moderate
      - name: Verify vulnerable lockfile fails
        id: vulnerable
        continue-on-error: true
        uses: ./
        with:
          mode: deps
          path: tests/e2e/vulnerable
      - name: Assert vulnerable lockfile was blocked
        if: ${{ always() }}
        run: |
          if [ "${{ steps.vulnerable.outcome }}" != "failure" ] || \
             [[ "${{ steps.vulnerable.outputs.verdict }}" != *"GHSA-35jh-r3h4-6jhm"* ]]; then
            echo "Gate did not block lodash advisory GHSA-35jh-r3h4-6jhm" >&2
            exit 1
          fi
      - name: Build bun-style image without npm hidden lockfile
        run: timeout 600 docker build -t local/security-gate-e2e:image tests/e2e/image
      - name: Verify npm packages in an image are gated
        id: image
        continue-on-error: true
        uses: ./
        with:
          mode: image
          image: local/security-gate-e2e:image
      - name: Assert image npm package was blocked
        if: ${{ always() }}
        run: |
          if [ "${{ steps.image.outcome }}" != "failure" ] || \
             [[ "${{ steps.image.outputs.verdict }}" != *"GHSA-35jh-r3h4-6jhm"* ]]; then
            echo "Gate did not block lodash advisory GHSA-35jh-r3h4-6jhm in image node_modules" >&2
            exit 1
          fi
