name: Security gate
description: "Block CRITICAL and HIGH OSV advisories before deployment."
outputs:
  verdict:
    description: "Gate exit code and advisory IDs evaluated by the gate."
    value: ${{ steps.scan.outputs.verdict }}
inputs:
  mode:
    description: "Scan mode: deps or image."
    required: false
    default: deps
  path:
    description: "Directory to scan recursively in deps mode, relative to repository root."
    required: false
    default: .
  image:
    description: "Built local Docker image reference to scan in image mode."
    required: false
  config:
    description: "Ignore file path, relative to repository root."
    required: false
    default: .security-gate.toml
runs:
  using: composite
  steps:
    - name: Scan dependencies or image
      id: scan
      shell: bash
      env:
        GATE_MODE: ${{ inputs.mode }}
        GATE_PATH: ${{ inputs.path }}
        GATE_IMAGE: ${{ inputs.image }}
        GATE_CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        scanner_version='v2.7.0'
        scanner_sha256='160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b'
        scanner="$RUNNER_TEMP/osv-scanner-${scanner_version}-linux-amd64"
        scanner_url="https://github.com/google/osv-scanner/releases/download/${scanner_version}/osv-scanner_linux_amd64"
        scanner_config="$(mktemp "$RUNNER_TEMP/security-gate-osv-config.XXXXXX.toml")"
        scan_output="$(mktemp "$RUNNER_TEMP/security-gate.XXXXXX.json")"
        npm_dir="$(mktemp -d "$RUNNER_TEMP/security-gate-image-npm.XXXXXX")"
        npm_output="$(mktemp "$RUNNER_TEMP/security-gate-image-npm.XXXXXX.json")"
        container=''
        cleanup() {
          rm -f "$scanner_config" "$scan_output" "$npm_output" "$npm_dir/package-lock.json"
          rmdir "$npm_dir"
          if [ -n "$container" ]; then
            docker rm -v "$container" > /dev/null || true
          fi
        }
        trap cleanup EXIT
        # osv-scanner v2.7.0 --config overrides discovered osv-scanner.toml files;
        # scan source --no-ignore includes .gitignore paths:
        # https://github.com/google/osv-scanner/blob/v2.7.0/docs/configuration.md
        # https://github.com/google/osv-scanner/blob/v2.7.0/docs/scan-source.md
        case "$GATE_MODE" in
          deps)
            scan_args=(scan source -r "$GATE_PATH" --format json --config "$scanner_config" --no-ignore)
            scan_target="$GATE_PATH"
            ;;
          image)
            if [ -z "$GATE_IMAGE" ]; then
              echo '::error::input image is required when mode is image' >&2
              exit 2
            fi
            scan_args=(scan image "$GATE_IMAGE" --format json --config "$scanner_config")
            scan_target="$GATE_IMAGE"
            ;;
          *)
            echo '::error::input mode must be deps or image' >&2
            exit 2
            ;;
        esac
        case "$GATE_CONFIG" in
          /*)
            echo '::error::input config must be relative to repository root' >&2
            exit 2
            ;;
        esac
        cd "$GITHUB_WORKSPACE"
        curl -fsSL --retry 3 --retry-delay 1 "$scanner_url" -o "$scanner"
        printf '%s  %s\n' "$scanner_sha256" "$scanner" | sha256sum -c -
        chmod 0755 "$scanner"
        # osv-scanner v2.7.0 maps vulnerabilities to 1, no packages to 128,
        # and generic errors to 127: https://github.com/google/osv-scanner/blob/v2.7.0/cmd/osv-scanner/internal/cmd/run.go
        set +e
        "$scanner" "${scan_args[@]}" > "$scan_output"
        scanner_status=$?
        set -e
        case "$scanner_status" in
          0|1)
            gate_args=(--input "$scan_output" --scanner-status "$scanner_status")
            ;;
          128)
            gate_args=()
            ;;
          *)
            echo "::error::osv-scanner exited with code $scanner_status" >&2
            exit "$scanner_status"
            ;;
        esac
        if [ "$GATE_MODE" = image ]; then
          # osv-scanner v2.7.0 image mode reads npm packages only from
          # node_modules/.package-lock.json, which bun and pnpm never write: list every
          # package installed under node_modules in the image and scan them as a lockfile.
          container="$(docker create "$GATE_IMAGE" security-gate-export)"
          docker export "$container" | python3 "$GITHUB_ACTION_PATH/image_npm_lockfile.py" --output "$npm_dir/package-lock.json"
          if [ -f "$npm_dir/package-lock.json" ]; then
            set +e
            "$scanner" scan source -r "$npm_dir" --format json --config "$scanner_config" --no-ignore > "$npm_output"
            npm_status=$?
            set -e
            case "$npm_status" in
              0|1)
                gate_args+=(--input "$npm_output" --scanner-status "$npm_status")
                ;;
              *)
                echo "::error::osv-scanner exited with code $npm_status on npm packages installed in the image" >&2
                exit "$npm_status"
                ;;
            esac
          fi
        fi
        if [ "${#gate_args[@]}" -eq 0 ]; then
          echo "::error::osv-scanner found no supported lockfile or package at $scan_target" >&2
          exit 128
        fi
        python3 "$GITHUB_ACTION_PATH/gate.py" "${gate_args[@]}" --config "$GITHUB_WORKSPACE/$GATE_CONFIG" --workspace "$GITHUB_WORKSPACE"
